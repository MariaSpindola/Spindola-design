<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinAI - Controle Financeiro Inteligente</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a31;
      --card-soft: #1a2544;
      --primary: #7c8cff;
      --primary-soft: #9ca8ff;
      --accent: #2de2b5;
      --danger: #ff6b81;
      --text: #edf2ff;
      --muted: #b2bdd9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #18264b 0%, var(--bg) 50%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: min(1200px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    .header {
      background: linear-gradient(120deg, #1f2a52, #1a2040);
      border: 1px solid #303f76;
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .header h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); }
    .header p { color: var(--muted); margin-top: 8px; }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .stack { display: grid; gap: 20px; }

    .card {
      background: var(--card);
      border: 1px solid #27355f;
      border-radius: 16px;
      padding: 18px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--primary-soft);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-item {
      background: var(--card-soft);
      border-radius: 12px;
      padding: 14px;
      border: 1px solid #2d3f73;
    }

    .summary-item strong { font-size: 1.15rem; display: block; margin-top: 6px; }

    .income { color: var(--accent); }
    .expense { color: var(--danger); }

    form {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    input, select, button {
      border: 1px solid #33487f;
      border-radius: 10px;
      background: #0d1630;
      color: var(--text);
      padding: 10px;
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      background: var(--primary);
      border: none;
      color: #0c1230;
      font-weight: 700;
      transition: .2s;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.1); }

    .transactions {
      max-height: 280px;
      overflow: auto;
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .transaction {
      background: #101a36;
      border: 1px solid #2b3b6a;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .transaction small { color: var(--muted); display: block; margin-top: 2px; }

    .goal {
      background: var(--card-soft);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #2d3f73;
      margin-top: 10px;
    }

    .bar {
      width: 100%;
      height: 10px;
      background: #0d1630;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #5f72ff, #2de2b5);
      width: 0;
      transition: width .3s;
    }

    .chat {
      display: grid;
      gap: 10px;
      max-height: 400px;
      overflow: auto;
      padding-right: 4px;
      margin-bottom: 8px;
    }

    .msg {
      padding: 10px;
      border-radius: 10px;
      max-width: 90%;
      line-height: 1.4;
    }

    .bot { background: #1d2d5c; border: 1px solid #3a4f91; }
    .user { background: #2b385f; border: 1px solid #4b5f9c; margin-left: auto; }

    .assistant-form {
      display: flex;
      gap: 8px;
    }

    .assistant-form input { flex: 1; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      form { grid-template-columns: 1fr 1fr; }
      .summary { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <div>
        <h1>FinAI 💸</h1>
        <p>Aplicativo de finanças pessoais com assistente financeiro usando I.A.</p>
      </div>
      <div>
        <p>Data: <strong id="today"></strong></p>
      </div>
    </section>

    <section class="grid">
      <div class="stack">
        <article class="card">
          <h2>Resumo Financeiro</h2>
          <div class="summary">
            <div class="summary-item">
              Receitas
              <strong class="income" id="income">R$ 0,00</strong>
            </div>
            <div class="summary-item">
              Despesas
              <strong class="expense" id="expense">R$ 0,00</strong>
            </div>
            <div class="summary-item">
              Saldo
              <strong id="balance">R$ 0,00</strong>
            </div>
          </div>
        </article>

        <article class="card">
          <h2>Nova Transação</h2>
          <form id="transaction-form">
            <input type="text" id="description" placeholder="Descrição" required />
            <input type="number" step="0.01" id="amount" placeholder="Valor" required />
            <select id="type" required>
              <option value="income">Receita</option>
              <option value="expense">Despesa</option>
            </select>
            <button type="submit">Adicionar</button>
          </form>

          <div class="transactions" id="transactions"></div>
        </article>
      </div>

      <div class="stack">
        <article class="card">
          <h2>Meta de Economia</h2>
          <input type="number" id="goal-value" placeholder="Ex.: 5000" />
          <button id="save-goal" style="margin-top:8px; width:100%;">Salvar Meta</button>

          <div class="goal">
            <p><strong>Meta:</strong> <span id="goal-label">R$ 0,00</span></p>
            <p><strong>Progresso:</strong> <span id="goal-progress">0%</span></p>
            <div class="bar"><div class="fill" id="goal-fill"></div></div>
          </div>
        </article>

        <article class="card">
          <h2>Assistente Financeiro IA</h2>
          <div class="chat" id="chat"></div>
          <form id="assistant-form" class="assistant-form">
            <input type="text" id="assistant-input" placeholder="Pergunte sobre gastos, economia, orçamento..." required />
            <button type="submit">Enviar</button>
          </form>
        </article>
      </div>
    </section>
  </main>

  <script>
    const currency = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
    const storageKey = 'finai-transactions-v1';
    const goalKey = 'finai-goal-v1';

    const state = {
      transactions: JSON.parse(localStorage.getItem(storageKey) || '[]'),
      goal: Number(localStorage.getItem(goalKey) || 0)
    };

    const el = {
      today: document.getElementById('today'),
      income: document.getElementById('income'),
      expense: document.getElementById('expense'),
      balance: document.getElementById('balance'),
      form: document.getElementById('transaction-form'),
      description: document.getElementById('description'),
      amount: document.getElementById('amount'),
      type: document.getElementById('type'),
      transactions: document.getElementById('transactions'),
      goalValue: document.getElementById('goal-value'),
      saveGoal: document.getElementById('save-goal'),
      goalLabel: document.getElementById('goal-label'),
      goalProgress: document.getElementById('goal-progress'),
      goalFill: document.getElementById('goal-fill'),
      chat: document.getElementById('chat'),
      assistantForm: document.getElementById('assistant-form'),
      assistantInput: document.getElementById('assistant-input')
    };

    function persist() {
      localStorage.setItem(storageKey, JSON.stringify(state.transactions));
      localStorage.setItem(goalKey, String(state.goal));
    }

    function totals() {
      const income = state.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
      const expense = state.transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
      return { income, expense, balance: income - expense };
    }

    function renderSummary() {
      const { income, expense, balance } = totals();
      el.income.textContent = currency.format(income);
      el.expense.textContent = currency.format(expense);
      el.balance.textContent = currency.format(balance);
      el.balance.className = balance >= 0 ? 'income' : 'expense';
      renderGoal();
    }

    function removeTransaction(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      persist();
      render();
    }

    function renderTransactions() {
      if (!state.transactions.length) {
        el.transactions.innerHTML = '<p style="color: var(--muted)">Nenhuma transação ainda.</p>';
        return;
      }

      el.transactions.innerHTML = state.transactions
        .slice()
        .reverse()
        .map(t => `
          <div class="transaction">
            <div>
              <strong>${t.description}</strong>
              <small>${new Date(t.date).toLocaleDateString('pt-BR')}</small>
            </div>
            <div style="text-align:right">
              <strong class="${t.type === 'income' ? 'income' : 'expense'}">${currency.format(t.amount)}</strong><br/>
              <button onclick="removeTransaction('${t.id}')" style="margin-top:6px;background:#22315f;color:#d6def9">Remover</button>
            </div>
          </div>
        `).join('');
    }

    function renderGoal() {
      const { balance } = totals();
      el.goalLabel.textContent = currency.format(state.goal);
      const progress = state.goal > 0 ? Math.max(0, Math.min(100, (balance / state.goal) * 100)) : 0;
      el.goalProgress.textContent = `${progress.toFixed(1)}%`;
      el.goalFill.style.width = `${progress}%`;
    }

    function addBotMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg bot';
      div.textContent = text;
      el.chat.appendChild(div);
      el.chat.scrollTop = el.chat.scrollHeight;
    }

    function addUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg user';
      div.textContent = text;
      el.chat.appendChild(div);
      el.chat.scrollTop = el.chat.scrollHeight;
    }

    function financialAI(question) {
      const q = question.toLowerCase();
      const { income, expense, balance } = totals();
      const savingRate = income > 0 ? ((income - expense) / income) * 100 : 0;

      if (q.includes('gasto') || q.includes('despesa')) {
        return `Suas despesas totais estão em ${currency.format(expense)}. Minha sugestão: aplique a regra 50/30/20 e limite gastos variáveis em até 30% da renda.`;
      }

      if (q.includes('econom') || q.includes('meta')) {
        if (state.goal <= 0) return 'Defina uma meta de economia para eu calcular um plano mensal personalizado.';
        const remaining = Math.max(0, state.goal - Math.max(0, balance));
        return `Faltam ${currency.format(remaining)} para sua meta. Se guardar ${currency.format(remaining / 6)} por mês, você atinge em 6 meses.`;
      }

      if (q.includes('saldo') || q.includes('situação')) {
        return `Seu saldo atual é ${currency.format(balance)} e sua taxa de poupança está em ${savingRate.toFixed(1)}%.`; 
      }

      return 'Posso te ajudar com gastos, orçamento, metas e dicas para reduzir despesas. Pergunte por exemplo: “Como economizar mais este mês?”';
    }

    function render() {
      renderSummary();
      renderTransactions();
    }

    el.form.addEventListener('submit', (e) => {
      e.preventDefault();
      const description = el.description.value.trim();
      const amount = Number(el.amount.value);
      const type = el.type.value;
      if (!description || !amount || amount <= 0) return;

      state.transactions.push({
        id: crypto.randomUUID(),
        description,
        amount,
        type,
        date: new Date().toISOString()
      });

      persist();
      render();
      el.form.reset();
      addBotMessage('Transação registrada com sucesso. Quer que eu analise seus gastos?');
    });

    el.saveGoal.addEventListener('click', () => {
      const value = Number(el.goalValue.value);
      if (value > 0) {
        state.goal = value;
        persist();
        renderGoal();
        addBotMessage(`Meta salva em ${currency.format(value)}. Vou acompanhar seu progresso.`);
      }
    });

    el.assistantForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = el.assistantInput.value.trim();
      if (!text) return;
      addUserMessage(text);
      const answer = financialAI(text);
      setTimeout(() => addBotMessage(answer), 250);
      el.assistantInput.value = '';
    });

    window.removeTransaction = removeTransaction;

    el.today.textContent = new Date().toLocaleDateString('pt-BR', {
      weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
    });

    render();
    addBotMessage('Olá! Sou sua assistente financeira de IA. Posso analisar seus gastos e sugerir melhorias.');
  </script>
</body>
</html>
